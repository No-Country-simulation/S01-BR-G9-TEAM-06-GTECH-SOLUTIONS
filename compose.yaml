name: intelliwatts

services:
  mysql:
    image: mysql:8.4.10
    environment:
      MYSQL_DATABASE: ${DB_NAME:-intelliwatts}
      MYSQL_USER: ${DB_USER:-intelliwatts}
      MYSQL_PASSWORD: ${DB_PASSWORD:-intelliwatts_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-intelliwatts_root_local}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
