spring:
  application:
    name: intelliwatts-backend

  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}

intelliwatts:
  analise:
    tarifa-referencia: ${TARIFA_REFERENCIA:0.75}
  datascience:
    base-url: ${DATASCIENCE_BASE_URL:http://localhost:8000}
    caminho-inferencia: ${DATASCIENCE_CAMINHO_INFERENCIA:/v1/inferencias}
    tempo-conexao: ${DATASCIENCE_TEMPO_CONEXAO:300ms}
    tempo-resposta: ${DATASCIENCE_TEMPO_RESPOSTA:1500ms}
